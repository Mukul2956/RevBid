[project]
name = "auction-platform-api"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "B008"]  # assert in tests; Depends() in signatures is idiomatic FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # seeded RNG keeps failures reproducible
"scripts/**" = ["S105", "S106"]
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["concurrency: concurrency/race-condition tests (slower)"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async layer runs on greenlets; without this, code after an `await` is under-reported.
concurrency = ["greenlet", "thread"]
omit = ["app/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]
